<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solar Flow Card demo</title>
  <style>
    body { margin: 0; padding: 20px; font-family: system-ui, sans-serif; background: #1b1d22; color: #e8eaf0; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 18px; }
    .bar label { font-size: 13px; color: #9aa3b2; }
    .bar select { margin-left: 6px; padding: 5px 8px; border-radius: 8px; background: #2a2e37; color: inherit; border: 1px solid #3a3f4b; }
    .cards { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
    .cards > div { width: var(--w, 520px); max-width: 100%; }
  </style>
</head>
<body>
  <div class="bar">
    <strong>Solar Flow Card</strong>
    <label>Theme <select id="theme"><option>all</option><option>diorama</option><option>aurora</option><option>paper</option><option>lcars</option><option>atlantis</option><option>expanse</option><option>foundation</option><option>galaxy</option></select></label>
    <label>Scenario <select id="scenario"></select></label>
    <label>Language <select id="language"><option>pl</option><option>en</option></select></label>
    <label>PV <select id="solar"><option value="1">yes</option><option value="0">no (EMS)</option></select></label>
    <label>Width <select id="width"><option>520</option><option>420</option><option>360</option><option>700</option></select></label>
  </div>
  <div class="cards" id="cards"></div>
  <script>customElements.define("ha-card", class extends HTMLElement {});</script>
  <script type="module">
    import "../solar-flow-card.js";
    import { createHass, SCENARIOS } from "./mock-hass.js";

    const params = new URLSearchParams(location.search);
    const $ = (id) => document.getElementById(id);
    $("scenario").innerHTML = Object.entries(SCENARIOS).map(([key, s]) => `<option value="${key}">${s.label}</option>`).join("");
    for (const id of ["theme", "scenario", "language", "width", "solar"]) {
      if (params.get(id)) {
        // Lets ?language=de show a new translation before the demo lists it.
        if (![...$(id).options].some((o) => o.value === params.get(id))) $(id).add(new Option(params.get(id)));
        $(id).value = params.get(id);
      }
      $(id).addEventListener("change", render);
    }

    function render() {
      const themes = $("theme").value === "all" ? ["diorama", "aurora", "paper", "lcars", "atlantis", "expanse", "foundation", "galaxy"] : [$("theme").value];
      const hass = createHass({ scenario: $("scenario").value, language: $("language").value });
      const cards = $("cards");
      cards.style.setProperty("--w", `${$("width").value}px`);
      cards.innerHTML = "";
      for (const theme of themes) {
        const wrap = document.createElement("div");
        const card = document.createElement("solar-flow-card");
        card.setConfig({
          theme,
          battery_capacity: 23.5,
          battery_min_soc: 10,
          pv_capacity: 8,
          price_import: 1.1,
          price_export: 0.3,
          co2_factor: 0.7,
          period: params.get("period") || undefined,
          show_solar: $("solar").value === "0" ? false : undefined,
        });
        card.hass = hass;
        wrap.appendChild(card);
        cards.appendChild(wrap);
      }
    }
    render();
    window.demoReady = true;
  </script>
</body>
</html>
